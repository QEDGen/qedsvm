[package]
name = "qedsvm-sbpfv3-compiled-account"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-define-syscall = "=5.2.0"
# The syscall wrapper emits a V3 static call using the symbol hash.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
