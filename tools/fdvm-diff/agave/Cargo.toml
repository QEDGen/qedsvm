[package]
name = "agvcase"
version = "0.0.0"
edition = "2021"
publish = false
description = "Runs fd_vm-harness case batches through agave's solana-sbpf interpreter"

[dependencies]
# The interpreter agave 4.4 runs. 0.24.0 left the interpreter and
# RequisiteVerifier unchanged from 0.23.0, where the verifier vectors
# were first checked (#91).
solana-sbpf = { version = "=0.24.0", default-features = false }

# Standalone: not part of the qedsvm-rs workspace.
[workspace]
